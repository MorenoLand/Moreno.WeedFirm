<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1d1a14; }
#canvas { display: block; width: 100%; height: 100%; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1d1a14; color: #eee259; font: 600 28px system-ui, sans-serif; text-align: center; padding: 24px; }
#bar { width: min(320px, 70vw); height: 8px; margin-top: 20px; background: #3a3426; border-radius: 4px; overflow: hidden; }
#fill { height: 100%; width: 0; background: #eee259; }
#msg { margin-top: 16px; font-size: 16px; font-weight: 400; color: #bdb77a; max-width: 560px; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser does not support HTML5 canvas.</canvas>
<div id="status"><div>$GODOT_PROJECT_NAME</div><div id="bar"><div id="fill"></div></div><div id="msg"></div></div>
<script src="$GODOT_URL"></script>
<script>
const config = $GODOT_CONFIG;
const engine = new Engine(config);
const fill = document.getElementById('fill');
const msg = document.getElementById('msg');
if (!Engine.isWebGLAvailable()) {
	msg.textContent = 'WebGL is required and is not available in this browser.';
} else {
	engine.startGame({
		onProgress: (current, total) => { if (total > 0) fill.style.width = (current / total * 100) + '%'; },
	}).then(() => {
		document.getElementById('status').remove();
		document.getElementById('canvas').focus();
	}, (err) => {
		msg.textContent = 'Failed to start: ' + err.message;
	});
}
</script>
</body>
</html>
